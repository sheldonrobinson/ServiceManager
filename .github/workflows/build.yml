name: Build Service Manager

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ServiceManager.exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install AutoIt via Chocolatey
      run: |
        choco install autoit -y --version 3.3.16.1

    - name: Build ServiceManager.exe
      run: |
        & "C:\Program Files (x86)\AutoIt3\Aut2exe\Aut2exe.exe" /in ServiceManager.au3 /out ServiceManager.exe /x64

    - name: Verify build
      run: |
        Get-ChildItem ServiceManager.exe | Select-Object Name, Length, LastWriteTime

    - name: Extract version
      id: version
      run: |
        $content = Get-Content ServiceManager.au3 | Select-String 'Service Manager.*AutoIt'
        $version = [regex]::Match($content, 'v?(\d+\.\d+\.\d+)').Groups[1].Value
        if (-not $version) { $version = "1.0.0" }
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ServiceManager
        path: ServiceManager.exe
        retention-days: 7

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ServiceManager
        path: .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ServiceManager.exe
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}