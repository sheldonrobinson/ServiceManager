name: Build Service Manager

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ServiceManager.exe
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install AutoIt via Chocolatey
      run: |
        choco install autoit -y --version 3.3.16.1

    - name: Build ServiceManager.exe
      run: |
        & "C:\Program Files (x86)\AutoIt3\Aut2exe\Aut2exe.exe" /in ServiceManager.au3 /out ServiceManager.exe /x64

    - name: Verify build
      run: |
        Get-ChildItem ServiceManager.exe | Select-Object Name, Length, LastWriteTime

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ServiceManager.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ServiceManager
        path: ServiceManager.exe
        retention-days: 7